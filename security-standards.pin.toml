# `revision` to check out security-standards and passes both to the Docker build; the Dockerfile's
# in-build gate (build_registry_bundle.py --artifact-sha256) fails closed if the assembled bundle's
# digest != artifact_sha256. Bump BOTH together when a registry actor changes (recompute the digest
# locally: scripts/shape_registry_context.py against a security-standards checkout, then
# build_registry_bundle.py's artifact_digest).
