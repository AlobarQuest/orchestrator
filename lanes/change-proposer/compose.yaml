# sds-lane-change-proposer (ADR-0059 increment 4): the change-proposer lane. HQ creates the resource
# from this file. It serves nothing: no port, no domain, so no Traefik labels and no `networks:`
# entry, as `lanes/landing-ledger/compose.yaml`. It clones nothing and keeps no state (ADR-0059
# decision 1, the lane-state table's "Moves" row), so it mounts no state volume: its one mount is the
# broker's socket directory.
# It holds no token: it reads the orchestrator's observer bearer, the change-manager propose bearer
# (on `--submit` runs only) and the read-only App's key, and mints the pass's GitHub token, through
# the lane secrets broker (ADR-0055 amendment 30), whose socket directory
# `/data/sds/broker/change-proposer` it mounts read-only at `/run/sds-broker`. `lane-run` names the
# socket to the launcher (`scripts/run-change-proposer.sh`), and the broker serves it only the UUIDs
# its entry in `lanes/secrets-broker/allowlist.toml` lists. The resource keeps its
# `CHANGE_PROPOSER_BWS_ACCESS_TOKEN` variable until the lane tokens are revoked, and this file maps
# it to nothing.
# `SDS_DEADMAN_PING_URL_UUID` is the BWS secret id of the lane's ping-URL secret,
# `change-proposer-ping-url` in `Rotation / Keepers`: an id, not a secret and not the ping URL.
# `lane-run` passes it to the launcher, whose dead-man helper reads the URL from that secret
# through the broker on a `--submit` pass (`scripts/sds-deadman.sh`); a dry run pings nothing.
# The VM rotation executor writes the URL there from its inbox; while the secret holds the inbox's
# empty marker, the helper refuses it and pings nothing, and the pass itself still runs. The
# schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on.
services:
  change-proposer:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["change-proposer"]
    environment:
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      SDS_DEADMAN_PING_URL_UUID: 7651ccc2-7e13-417b-86da-b50100c0d4b2
    volumes:
      - /data/sds/broker/change-proposer:/run/sds-broker:ro
    restart: unless-stopped
