# sds-lane-membership-check (ADR-0059 increment 3, amendment 5): the membership-check lane. HQ
# creates the resource from this file. It serves nothing: no port, no domain, so no Traefik labels
# and no `networks:` entry, as `lanes/landing-ledger/compose.yaml`. It keeps no state (ADR-0059
# decision 1, the lane-state bullet), so it mounts no volume: its one clone, of intent-packages, goes
# in each pass's own `HOME`, which `lane-run` deletes after the pass. The lane's token is the
# resource's own `MEMBERSHIP_CHECK_BWS_ACCESS_TOKEN` variable, which the VM rotation executor
# writes; this file names it and never holds a value. With it the launcher reads the orchestrator's
# observer bearer, the change-manager READ bearer and the read-only App's key, and mints the pass's
# GitHub token (`scripts/run-membership-check.sh`).
# `SDS_DEADMAN_PING_URL_UUID` is empty until the lane's ping-URL secret,
# `membership-check-ping-url` in `Rotation / Keepers`, exists: the VM root creates that keeper at
# cut-over and a later change writes its id here. While it is empty the dead-man helper falls
# back to the Mac's lookup by check name, which needs the broad Keychain identity the container
# doesn't have, so a pass pings nothing and logs `no SDS_DEADMAN_PING_URL_UUID and no broad BWS
# identity — alerting disabled this run` (`scripts/sds-deadman.sh`); the pass itself still runs.
# The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on.
services:
  membership-check:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["membership-check"]
    environment:
      BWS_ACCESS_TOKEN: ${MEMBERSHIP_CHECK_BWS_ACCESS_TOKEN}
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      SDS_DEADMAN_PING_URL_UUID: ""
    restart: unless-stopped
