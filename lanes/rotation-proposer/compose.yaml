# sds-lane-rotation-proposer (ADR-0059 increment 4, step 3f-5): the rotation-proposer lane. HQ
# creates the resource from this file. It serves nothing: no port, no domain, so no Traefik labels.
# It joins no network beyond the resource's own: it holds no chain credential (D-43 B; ADR-0055
# amendment 24 item 5) and reaches no separate Coolify database resource, and every service it calls
# (change-manager, the orchestrator, alert-hub, GitHub) is an HTTPS URL.
# Its state is the proposer's `alerts.json` and `approval-since.json`, on a named volume at
# `ROTATION_PROPOSER_STATE_DIR`, and infraops' `cred-rotation-state.json` in that volume's
# `security-drift` directory, at `SECURITY_DRIFT_STATE_DIR` (ADR-0059 Amendment 12). The Mac's
# `sds/rotation-proposer` files and its `~/.config/infra-drift/cred-rotation-state.json` are copied
# in at cut-over, before the first acting pass; until the state file is there the launcher refuses
# every pass with exit 2. Its intent-packages clone, its four credential-registry clones, the
# `cred-consumers.list` naming them (at `INFRADRIFT_CONFIG_DIR`) and its registry mirrors aren't
# state: the launcher makes them each pass under `/var/tmp/sds-rotation-proposer` and discards them
# (ADR-0059 decision 1). Both infraops settings come from this file alone; there is no default, and
# the launcher refuses a pass with either unset or empty.
# The lane's token is the resource's own `ROTATION_PROPOSER_BWS_ACCESS_TOKEN` variable, which the VM
# rotation executor writes; this file names it and never holds a value. With it the launcher reads
# every secret the pass needs (`scripts/run-rotation-proposer.sh`, "TWO HOSTS, ONE LAUNCHER").
# `SDS_DEADMAN_PING_URL_UUID` is empty until a later change writes the id of the lane's ping-URL
# secret, `rotation-proposer-ping-url` in `Rotation / Keepers`, created at HQ gate G-75: an id, not a secret
# and not the ping URL. While it's empty the dead-man helper
# resolves no ping URL in the container and pings nothing; the pass itself still runs.
# The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on.
services:
  rotation-proposer:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["rotation-proposer"]
    environment:
      BWS_ACCESS_TOKEN: ${ROTATION_PROPOSER_BWS_ACCESS_TOKEN}
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      ROTATION_PROPOSER_STATE_DIR: /var/lib/sds/rotation-proposer
      SDS_DEADMAN_PING_URL_UUID: ""
      INFRADRIFT_CONFIG_DIR: /var/tmp/sds-rotation-proposer/infra-drift
      SECURITY_DRIFT_STATE_DIR: /var/lib/sds/rotation-proposer/security-drift
    volumes:
      - sds-lanes-rotation-proposer-state:/var/lib/sds/rotation-proposer
    restart: unless-stopped

volumes:
  sds-lanes-rotation-proposer-state:
