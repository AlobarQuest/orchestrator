# sds-lane-deploy-watcher (ADR-0059 increment 3, Amendment 1): the deploy-watcher lane. HQ creates
# the resource from this file. It serves nothing: no port, no domain, so no Traefik labels and no
# `networks:` entry, as `lanes/landing-ledger/compose.yaml`. The watcher keeps no state (amendment
# 3), so it mounts no volume: its one mount is the broker's socket directory.
# It holds no token: it reads the orchestrator's observer bearer, change-manager's observe bearer
# and the read-only App's key, and mints the pass's GitHub token, through the lane secrets broker
# (ADR-0055 amendment 30), whose socket directory `/data/sds/broker/deploy-watcher` it mounts
# read-only at `/run/sds-broker`. `lane-run` names the socket to the launcher
# (`scripts/run-deploy-watcher.sh`), and the broker serves it only the UUIDs its entry in
# `lanes/secrets-broker/allowlist.toml` lists. The resource keeps its
# `DEPLOY_WATCHER_BWS_ACCESS_TOKEN` variable until the lane tokens are revoked, and this file maps
# it to nothing.
# `SDS_DEADMAN_PING_URL_UUID` is the BWS secret id of the lane's ping-URL secret,
# `deploy-watcher-ping-url` in `Rotation / Keepers`: an id, not a secret and not the ping URL.
# `lane-run` passes it to the launcher, whose dead-man helper reads the URL from that secret
# through the broker (`scripts/sds-deadman.sh`). The VM rotation executor writes the URL there
# from its inbox; while the secret holds the inbox's empty marker, the helper refuses it and pings
# nothing. The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on.
services:
  deploy-watcher:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["deploy-watcher"]
    environment:
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      SDS_DEADMAN_PING_URL_UUID: 4f7f3d8b-a83e-4ae5-a665-b4ff0004b875
    volumes:
      - /data/sds/broker/deploy-watcher:/run/sds-broker:ro
    restart: unless-stopped
