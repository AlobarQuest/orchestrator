# sds-lane-revision-watcher (ADR-0059 increment 3, Amendment 1): the revision-watcher lane. HQ
# creates the resource from this file. It serves nothing: no port, no domain, so no Traefik labels
# and no `networks:` entry, as `lanes/landing-ledger/compose.yaml`. Its state is the acting pass's
# `alerts.json`, on a named volume at `REVISION_WATCHER_STATE_DIR`, as
# `lanes/execution-watch/compose.yaml`; the Mac's file is copied in at cut-over, before the first
# acting pass, or the alerts the Mac left firing never resolve. The lane's token is the resource's
# own `REVISION_WATCHER_BWS_ACCESS_TOKEN` variable, which the VM rotation executor writes; this
# file names it and never holds a value. With it the launcher reads the orchestrator's observer
# bearer, the hosting platform's token, App Brain's read key, the `sds-bridge` alert sender (acting
# passes only) and the read-only App's key, and mints the pass's GitHub token
# (`scripts/run-revision-watcher.sh`).
# `SDS_DEADMAN_PING_URL_UUID` is the BWS secret id of the lane's ping-URL secret,
# `revision-watcher-ping-url` in `Rotation / Keepers`: an id, not a secret and not the ping URL.
# `lane-run` passes it to the launcher, whose dead-man helper reads the URL from that secret with
# the lane's own token (`scripts/sds-deadman.sh`). The VM rotation executor writes the URL there
# from its inbox; while the secret holds the inbox's empty marker, the helper refuses it and pings
# nothing. The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on.
services:
  revision-watcher:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["revision-watcher"]
    environment:
      BWS_ACCESS_TOKEN: ${REVISION_WATCHER_BWS_ACCESS_TOKEN}
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      REVISION_WATCHER_STATE_DIR: /var/lib/sds/revision-watcher
      SDS_DEADMAN_PING_URL_UUID: 9b2722ea-8ec1-425b-ac2e-b4ff00cba931
    volumes:
      - sds-lanes-revision-watcher-state:/var/lib/sds/revision-watcher
    restart: unless-stopped

volumes:
  sds-lanes-revision-watcher-state:
