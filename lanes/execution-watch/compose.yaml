# sds-lane-execution-watch (ADR-0059 increment 2, Amendment 1): the execution-watch lane. HQ
# creates the resource from this file. It serves nothing: no port, no domain, so no Traefik labels
# and no `networks:` entry, as `lanes/placeholder/compose.yaml`. The lane's token is the resource's
# own `EXECUTION_WATCH_BWS_ACCESS_TOKEN` variable, which the VM rotation executor writes; this file
# names it and never holds a value. The dead-man ping-URL secret's UUID
# (`SDS_DEADMAN_PING_URL_UUID`) lands with the cut-over, once the secret exists; until then the
# launcher's dead-man helper finds no ping URL and pings nothing (`scripts/sds-deadman.sh`).
services:
  execution-watch:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["execution-watch"]
    environment:
      BWS_ACCESS_TOKEN: ${EXECUTION_WATCH_BWS_ACCESS_TOKEN}
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      EXECUTION_WATCH_STATE_DIR: /var/lib/sds/execution-watch
    volumes:
      - sds-lanes-execution-watch-state:/var/lib/sds/execution-watch
    restart: unless-stopped

volumes:
  sds-lanes-execution-watch-state:
