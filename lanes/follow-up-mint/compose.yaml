# sds-lane-follow-up-mint (ADR-0059 increment 9, Amendment 10): the follow-up-mint lane. HQ
# creates the resource from this file. It serves nothing: no port, no domain, so no Traefik labels.
# It joins no network beyond the resource's own, the `coolify` network included: it reaches no
# separate Coolify database resource. The one service it calls, the orchestrator, is an HTTPS URL
# at the launcher's default (`https://sds.alobar.net`).
# It keeps no state (decision 1, "Lane state"), so it mounts no volume.
# The lane's token is the resource's own `FOLLOW_UP_MINT_BWS_ACCESS_TOKEN` variable, which the VM
# rotation executor writes; this file names it and never holds a value. With it the launcher reads
# the orchestrator SYSTEM bearer, the lane's one work secret (`scripts/run-follow-up-mint.sh`).
# `SDS_DEADMAN_PING_URL_UUID` is empty until the lane's ping-URL secret exists: an id, not a secret
# and not the ping URL, which a later change writes here. While it's empty the outcome alarm
# resolves no ping URL in the container and pings nothing; the pass itself still runs.
# The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on
# (`docs/operations/deploy.md`, the follow-up-mint lane's cut-over).
services:
  follow-up-mint:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["follow-up-mint"]
    environment:
      BWS_ACCESS_TOKEN: ${FOLLOW_UP_MINT_BWS_ACCESS_TOKEN}
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      SDS_DEADMAN_PING_URL_UUID: ""
    restart: unless-stopped
