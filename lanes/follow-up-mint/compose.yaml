# sds-lane-follow-up-mint (ADR-0059 increment 9, Amendment 10): the follow-up-mint lane. HQ
# creates the resource from this file. It serves nothing: no port, no domain, so no Traefik labels.
# It joins no network beyond the resource's own, the `coolify` network included: it reaches no
# separate Coolify database resource. The one service it calls, the orchestrator, is an HTTPS URL
# at the launcher's default (`https://sds.alobar.net`).
# It keeps no state (decision 1, "Lane state"), so it mounts no volume: its one mount is the
# broker's socket directory.
# It holds no token: it reads the orchestrator SYSTEM bearer, the lane's one work secret, through
# the lane secrets broker (ADR-0055 amendment 30), whose socket directory
# `/data/sds/broker/follow-up-mint` it mounts read-only at `/run/sds-broker`. `lane-run` names the
# socket to the launcher (`scripts/run-follow-up-mint.sh`), and the broker serves it only the UUIDs
# its entry in `lanes/secrets-broker/allowlist.toml` lists.
# `SDS_DEADMAN_PING_URL_UUID` is the BWS secret id of the lane's ping-URL secret,
# `follow-up-mint-ping-url` in `Rotation / Keepers`: an id, not a secret and not the ping URL.
# `lane-run` passes it to the launcher, whose outcome alarm reads the URL from that secret through
# the broker socket on every pass (the launcher takes no flags, so it has no `--dry-run`;
# `scripts/sds-deadman.sh`), so the allowlist entry lists it too. The VM rotation executor writes
# the URL there from its inbox; while the secret holds the inbox's empty marker, the alarm refuses
# it and pings nothing, and the pass itself still runs.
# The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on
# (`docs/operations/deploy.md`, the follow-up-mint lane's cut-over).
services:
  follow-up-mint:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["follow-up-mint"]
    environment:
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      SDS_DEADMAN_PING_URL_UUID: 46e714ca-32b7-4e89-9817-b509013363a5
    volumes:
      - /data/sds/broker/follow-up-mint:/run/sds-broker:ro
    restart: unless-stopped
