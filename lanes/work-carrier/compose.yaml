# sds-lane-work-carrier (ADR-0059 increment 4, step 3f-2): the work-carrier lane. HQ creates the
# resource from this file. It serves nothing: no port, no domain, so no Traefik labels.
# It joins the external `coolify` network, unlike the other lanes, because the carry and its chain
# verify connect to a separate Coolify database resource, the factory-events chain (ADR-0059
# amendment 7 item 5; workspace invariant: a compose service that connects to a separate Coolify
# database resource joins `coolify`). That resource's container is `b82fa1vg5whecgnjreuqb5tk`,
# answering on `5432` inside the network; the `-proxy` container's `15432` is the tailnet publish,
# for the Mac only. The three chain settings are plain values (ADR-0055 amendment 26 item 3);
# `lane-run` passes them on, and the launcher refuses a pass with any of them empty.
# Its state is the watcher's `alerts.json`, on a named volume at `WORK_WATCHER_STATE_DIR`, as
# `lanes/rotation-decomposer/compose.yaml`; the Mac's `sds/work-watcher` files are copied in at
# cut-over, before the first acting pass, or the alerts the Mac left firing never resolve. Its
# intent-packages clone isn't state: the launcher clones it each pass under `/var/tmp` and discards
# it (ADR-0059 decision 1).
# It holds no token: the launcher reads every secret the pass needs, the chain's read password
# included, through the lane secrets broker (ADR-0055 amendment 30), whose socket directory
# `/data/sds/broker/work-carrier` it mounts read-only at `/run/sds-broker`. `lane-run` names the
# socket to the launcher (`scripts/run-work-carrier.sh`), and the broker serves it only the UUIDs
# its entry in `lanes/secrets-broker/allowlist.toml` lists. The resource keeps its
# `WORK_CARRIER_BWS_ACCESS_TOKEN` variable until the lane tokens are revoked, and this file maps it
# to nothing.
# `SDS_DEADMAN_PING_URL_UUID` is the BWS secret id of the lane's ping-URL secret,
# `work-carrier-ping-url` in `Rotation / Keepers`: an id, not a secret and not the ping URL.
# `lane-run` passes it to the launcher, whose dead-man helper reads the URL from that secret
# through the broker on a `--register` pass (`scripts/sds-deadman.sh`); a bare pass pings
# nothing. The VM rotation executor writes the URL there from its inbox; while the secret holds the
# inbox's empty marker, the helper refuses it and pings nothing, and the pass itself still runs.
# The schedule stays off (`LANE_SCHEDULE_ENABLED`) until the cut-over turns it on.
services:
  work-carrier:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["work-carrier"]
    environment:
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      WORK_WATCHER_STATE_DIR: /var/lib/sds/work-carrier
      SDS_DEADMAN_PING_URL_UUID: 55fbae20-e503-4eb5-b75c-b5040164d394
      FACTORY_EVENTS_DB_HOST: b82fa1vg5whecgnjreuqb5tk
      FACTORY_EVENTS_DB_PORT: "5432"
      FACTORY_EVENTS_DB_NAME: postgres
    volumes:
      - sds-lanes-work-carrier-state:/var/lib/sds/work-carrier
      - /data/sds/broker/work-carrier:/run/sds-broker:ro
    networks:
      - coolify
    restart: unless-stopped

volumes:
  sds-lanes-work-carrier-state:

networks:
  coolify:
    external: true
