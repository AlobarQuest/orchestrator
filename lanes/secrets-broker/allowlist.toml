# The lane secrets broker's allowlist (ADR-0055 amendment 30): for each lane, every BWS secret UUID
# that lane may read through its socket, `/data/sds/broker/<lane>/broker.sock`. The broker refuses
# any other UUID before it calls `bws`. The image bakes this file in, so a change takes effect only
# through a reviewed orchestrator PR and a release. The broker refuses to start if the file names a
# lane twice or holds a malformed lane name or UUID (`scripts/secrets_broker.py`).
#
# One table per lane, each UUID with its registry name:
#
#   [lanes.<lane>]
#   read = [
#     "<uuid>",  # <registry name>
#   ]
#
# Each lane's list is exactly the UUIDs its launcher, `scripts/run-<lane>.sh`, reads, plus the
# ping-URL secret its compose names in `SDS_DEADMAN_PING_URL_UUID`
# (`tests/scripts/test_secrets_broker_allowlist.py`).
[lanes]

[lanes.inert-landing]
read = [
  "314f276d-55ca-4ddc-a24d-b4a3013508cd",  # change-manager/M2M_TOKEN_READ
  "314a966c-5654-4e3c-8358-b4fd01268775",  # lanes-read-app-private-key
  "221a48d5-3f29-4898-b300-b4820140c880",  # orchestrator-system-bearer
  "b415d03b-f92d-46b1-8a9d-b4f10103df49",  # ALERT_HUB_SENDER_TOKEN_SDS_BRIDGE (--submit only)
  "35557473-f80c-44e3-892a-b507013158b1",  # inert-landing-ping-url
]

[lanes.estate-landing]
read = [
  "314f276d-55ca-4ddc-a24d-b4a3013508cd",  # change-manager/M2M_TOKEN_READ
  "314a966c-5654-4e3c-8358-b4fd01268775",  # lanes-read-app-private-key
  "221a48d5-3f29-4898-b300-b4820140c880",  # orchestrator-system-bearer
  "b415d03b-f92d-46b1-8a9d-b4f10103df49",  # ALERT_HUB_SENDER_TOKEN_SDS_BRIDGE (--submit only)
  "f9f59233-0794-4ea8-9806-b4f3011e6147",  # COOLIFY_TOKEN_SDS_ESTATE_LANDER (--submit only)
  "11e940d7-e43a-4ebd-9026-b508017d9cef",  # estate-landing-ping-url
]

[lanes.bump-driver]
read = [
  "221a48d5-3f29-4898-b300-b4820140c880",  # orchestrator-system-bearer
  "b415d03b-f92d-46b1-8a9d-b4f10103df49",  # ALERT_HUB_SENDER_TOKEN_SDS_BRIDGE
  "314f276d-55ca-4ddc-a24d-b4a3013508cd",  # change-manager/M2M_TOKEN_READ
  "750f737f-4cb6-4876-9a98-b48200ea1c0b",  # CODE_BRAIN_CONTRIBUTOR_KEY
  "da8134b0-565f-45c8-8965-b48200ea1c40",  # INFRA_BRAIN_CONTRIBUTOR_KEY
  "2f708d08-ea5d-4d11-bde0-b50200c9a60b",  # factory-events-read-password
  "314a966c-5654-4e3c-8358-b4fd01268775",  # lanes-read-app-private-key
]
