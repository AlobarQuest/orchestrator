# sds-lane-landing-ledger (ADR-0059 increment 3, Amendment 1): the landing-ledger lane. HQ creates
# the resource from this file. It serves nothing: no port, no domain, so no Traefik labels and no
# `networks:` entry, as `lanes/execution-watch/compose.yaml`. The ledger keeps no state (decision
# 1, "Lane state"), so it mounts no volume: its one mount is the broker's socket directory.
# It holds no token: it reads the observer bearer and the read-only App's key, and mints the pass's
# GitHub token, through the lane secrets broker (ADR-0055 amendment 30), whose socket directory
# `/data/sds/broker/landing-ledger` it mounts read-only at `/run/sds-broker`. `lane-run` names the
# socket to the launcher (`scripts/run-landing-ledger.sh`), and the broker serves it only the UUIDs
# its entry in `lanes/secrets-broker/allowlist.toml` lists. The resource keeps its
# `LANDING_LEDGER_BWS_ACCESS_TOKEN` variable until the lane tokens are revoked, and this file maps
# it to nothing.
# `SDS_DEADMAN_PING_URL_UUID` is the BWS secret id of the lane's ping-URL secret,
# `landing-ledger-ping-url` in `Rotation / Keepers`: an id, not a secret and not the ping URL.
# `lane-run` passes it to the launcher, whose dead-man helper reads the URL from that secret
# through the broker (`scripts/sds-deadman.sh`). The VM rotation executor writes the URL there
# from its inbox; while the secret holds the inbox's empty marker, the helper refuses it and pings
# nothing.
services:
  landing-ledger:
    image: ghcr.io/alobarquest/sds-lanes:${SDS_LANES_IMAGE_TAG}
    command: ["landing-ledger"]
    environment:
      LANE_SCHEDULE_ENABLED: ${LANE_SCHEDULE_ENABLED:-false}
      SDS_DEADMAN_PING_URL_UUID: ebabdd63-2eff-4b8e-99b7-b4fd01754eae
    volumes:
      - /data/sds/broker/landing-ledger:/run/sds-broker:ro
    restart: unless-stopped
