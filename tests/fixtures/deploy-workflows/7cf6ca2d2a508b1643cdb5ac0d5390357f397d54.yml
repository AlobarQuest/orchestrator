# Required repo Actions secrets:
#   COOLIFY_WEBHOOK_URL       — base URL for the Coolify deploy webhook
#   COOLIFY_API_TOKEN         — Coolify API bearer token
#   COOLIFY_APP_UUID_INFRA    — Coolify app UUID for infra-brain
#   COOLIFY_APP_UUID_OPEN     — Coolify app UUID for open-brain
#   COOLIFY_APP_UUID_APP      — Coolify app UUID for app-brain
#   COOLIFY_APP_UUID_CODE     — Coolify app UUID for code-brain (set after the
#                               code-brain Coolify app exists; until then the
#                               deploy/health steps skip it gracefully)
#
# These secrets are provisioned at cutover (Task 17). The build-and-push and
# deploy jobs are guarded to main-push only, so this workflow is safe to merge
# on a PR before secrets exist. A brain whose UUID secret is empty is skipped by
# both the deploy step and the revision check below, so adding a new brain never
# breaks the others' pipeline before its infra is provisioned.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time. Two merges landing inside Coolify's swap window would
# otherwise both deploy the same moving `:latest` tag and the earlier run would wait
# out its full deadline for a revision that had already been replaced — a red job
# reporting a rollout that in fact succeeded, just not with its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alobarquest/brain

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -x -q

  build-and-push:
    needs: test
    # PRs run tests only — build and deploy only on a real merge to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Carried into the image's environment and reported by /api/health, so the
          # deploy job below can tell the new container from the one it replaced.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy brain apps
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          UUID_INFRA: ${{ secrets.COOLIFY_APP_UUID_INFRA }}
          UUID_OPEN: ${{ secrets.COOLIFY_APP_UUID_OPEN }}
          UUID_APP: ${{ secrets.COOLIFY_APP_UUID_APP }}
          UUID_CODE: ${{ secrets.COOLIFY_APP_UUID_CODE }}
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/deployments.txt"

          for entry in "infra:${UUID_INFRA}" "open:${UUID_OPEN}" "app:${UUID_APP}" "code:${UUID_CODE}"; do
            name="${entry%%:*}"
            uuid="${entry##*:}"
            if [ -z "${uuid}" ]; then
              echo "Skipping ${name}-brain — no COOLIFY_APP_UUID_${name} secret configured yet."
              continue
            fi
            echo "Triggering deploy for ${name}-brain (uuid=${uuid})..."
            # KEEP THE DEPLOYMENT ID COOLIFY NAMES. Until 2026-09-07 this response was
            # printed and discarded, so the step below could ask production what it was
            # SERVING and could not ask Coolify whether the deployment had failed. It
            # had: on 2026-09-06 brain-app's deployment died two seconds in, Coolify
            # rolled it back, and the step below waited the full 600s for a swap that
            # had already been abandoned -- then reported an ambiguity rather than the
            # failure. app-brain served a stale build for a day and a half.
            response=$(curl -fsS -X GET "${WEBHOOK_URL}?uuid=${uuid}&force=false" \
              -H "Authorization: Bearer ${API_TOKEN}")
            deployment=$(printf '%s' "${response}" | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])' \
              2>/dev/null || true)
            # A 2xx that yields no deployment id is an accepted request that queued
            # nothing, and everywhere downstream that is indistinguishable from a
            # successful trigger.
            if [ -z "${deployment}" ]; then
              echo "[FAIL] the response for ${name}-brain names no deployment, so nothing"
              echo "       is known to have been queued."
              exit 1
            fi
            echo "  queued as ${deployment}"
            echo "${name} ${deployment}" >> "${RUNNER_TEMP}/deployments.txt"
          done

      # The step above succeeds the moment Coolify ACCEPTS each webhook — it says nothing
      # about whether a build finished, a container started, or the app came back.
      # Polling for `status == "ok"` does not fix that either: Coolify's redeploy is a
      # ROLLING update, so the OLD container answers the public domain throughout the
      # swap and a liveness poll returns 200 the whole time, whether or not the new image
      # ever ran. Measured on run 31317272047 (2026-08-09): all four brains reported
      # "healthy on attempt 1" thirty seconds after the webhooks, answered by the
      # containers that were already running.
      #
      # So the check is on the REVISION: it waits until every brain THIS run deployed
      # reports the commit just built. One image serves all four, so all four report the
      # same revision — each is still checked, because a per-app webhook can fail while
      # its siblings succeed, and that is the failure this step exists to catch. A brain
      # with no UUID secret was never triggered, keeps its old image and would never
      # report the new revision, so it is excluded rather than waited on.
      - name: Verify every deployed brain is serving the new revision
        env:
          EXPECTED: ${{ github.sha }}
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # A knob only so the timeout can be demonstrated in seconds instead of ten
          # minutes: a poll never seen to fail proves nothing. Production value is 600.
          DEADLINE_SECONDS: 600
          UUID_INFRA: ${{ secrets.COOLIFY_APP_UUID_INFRA }}
          UUID_OPEN: ${{ secrets.COOLIFY_APP_UUID_OPEN }}
          UUID_APP: ${{ secrets.COOLIFY_APP_UUID_APP }}
          UUID_CODE: ${{ secrets.COOLIFY_APP_UUID_CODE }}
        run: |
          set -euo pipefail

          # An empty expectation would match every unreadable response and pass
          # instantly — the poll-that-compares-nothing this step exists not to be.
          if [ -z "${EXPECTED}" ]; then
            echo "[FAIL] no expected revision was supplied; refusing to report success."
            exit 1
          fi

          # The deploy webhook IS an API route, so the rest of the API is one path
          # segment away. Derived rather than given a secret of its own, because two
          # secrets naming one Coolify can disagree and the wrong one fails as a 404
          # nobody attributes. Refused rather than guessed if the shape is not the one
          # this derivation assumes.
          api_base="${WEBHOOK_URL%/deploy}"
          if [ "${api_base}" = "${WEBHOOK_URL}" ]; then
            echo "[FAIL] COOLIFY_WEBHOOK_URL does not end in /deploy, so the API base"
            echo "       cannot be derived from it. Nothing here will guess a URL."
            exit 1
          fi

          pending=""
          for entry in "infra:${UUID_INFRA}" "open:${UUID_OPEN}" "app:${UUID_APP}" "code:${UUID_CODE}"; do
            name="${entry%%:*}"
            uuid="${entry##*:}"
            if [ -z "${uuid}" ]; then
              echo "Skipping ${name}-brain — not deployed by this pipeline."
              continue
            fi
            pending="${pending}${name} "
          done
          # The one path through this step that could not fail. A main push that
          # deploys nothing is how main and production diverge silently, which is the
          # whole failure this step exists to catch — so an empty subject list is a
          # missing-secrets alarm, not a quiet success.
          if [ -z "${pending}" ]; then
            echo "[FAIL] no COOLIFY_APP_UUID_* secret is set, so this push deployed"
            echo "       nothing and production is not serving ${EXPECTED}."
            exit 1
          fi

          echo "Waiting for ${EXPECTED} on: ${pending}"
          deadline=$(( SECONDS + DEADLINE_SECONDS ))
          while true; do
            waiting=""
            for name in ${pending}; do
              # ASK COOLIFY FIRST. Production answers what it is SERVING, and that cannot
              # tell a deployment still in flight from one that failed and was rolled
              # back: both leave the previous container answering, and this step used to
              # wait out the whole deadline on either. Coolify knows which it is.
              #
              # ONLY AN EXPLICIT `failed` DECIDES ANYTHING HERE. A status that cannot be
              # read is not a verdict -- the revision poll below remains the authority on
              # success and the deadline still binds -- so a Coolify that cannot be
              # reached costs a slower failure and never a wrong one. The response is
              # held in a variable and never echoed: it embeds the whole application
              # record.
              deployment=$(awk -v n="${name}" '$1 == n {print $2}' \
                "${RUNNER_TEMP}/deployments.txt")
              if [ -n "${deployment}" ]; then
                row=$(curl -fsS --max-time 10 \
                  "${api_base}/deployments/${deployment}" \
                  -H "Authorization: Bearer ${API_TOKEN}" 2>/dev/null || true)
                state=$(printf '%s' "${row}" | python3 -c \
                  'import json,sys; print(json.load(sys.stdin).get("status",""))' \
                  2>/dev/null || true)
                if [ "${state}" = "failed" ]; then
                  # The FIRST failure line only, and bounded. The ones after it carry the
                  # generated compose file base64-encoded, which says nothing a reader
                  # needs and is not this step's to publish.
                  reason=$(printf '%s' "${row}" | python3 -c \
                    'import json,sys; rows=json.loads(json.load(sys.stdin).get("logs") or "[]"); print(next((str(e.get("output","")) for e in rows if str(e.get("output","")).startswith("Deployment failed:")), ""))' \
                    2>/dev/null | head -1 | cut -c1-300)
                  echo "[FAIL] Coolify's deployment of ${name}-brain FAILED, so ${EXPECTED}"
                  echo "       was never going to arrive. ${name}-brain is still serving"
                  echo "       whatever it served before this run, and nothing will"
                  echo "       correct that on its own."
                  echo "       Coolify said: ${reason:-<no failure line in its log>}"
                  echo "       Deployment ${deployment}; the full log is in Coolify."
                  exit 1
                fi
              fi
              # No -f: /api/health answers 503 when the database is unreachable, and
              # that body still names the revision. Discarding it would label a brain
              # that HAS swapped to the new image `<unreachable>` and send whoever
              # reads this to the Coolify log for a deployment that worked.
              body=$(curl -s --max-time 10 "https://${name}-brain.devonwatkins.com/api/health" || true)
              fields=$(printf '%s' "${body}" | python3 -c \
                'import json,sys; d=json.load(sys.stdin); print(d.get("revision","") + "|" + d.get("status",""))' \
                2>/dev/null || true)
              seen="${fields%%|*}"
              state="${fields#*|}"
              # Both terms, because either alone passes something it should not: the
              # revision alone accepts a degraded brain, the status alone accepts the
              # container this deployment was supposed to replace.
              if [ "${seen}" = "${EXPECTED}" ] && [ "${state}" = "ok" ]; then
                echo "  [OK] ${name}-brain is serving ${EXPECTED}"
              else
                # Four distinct answers, because they send whoever reads this log to
                # four different places.
                if [ -z "${body}" ]; then
                  label="<no answer>"                    # down, DNS, TLS
                elif [ -z "${fields}" ]; then
                  label="<not a health response>"        # something else answered
                elif [ -z "${seen}" ]; then
                  label="<no revision reported>"         # ours, image predates this
                elif [ "${state}" != "ok" ]; then
                  label="${seen} but ${state}"           # ours, new image, unhealthy
                else
                  label="${seen}"                        # ours, a different build
                fi
                echo "  ${name}-brain is serving '${label}', waiting for ${EXPECTED}..."
                waiting="${waiting}${name} "
              fi
            done
            pending="${waiting}"
            if [ -z "${pending}" ]; then
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "[FAIL] after ${DEADLINE_SECONDS}s these brains are not serving ${EXPECTED}: ${pending}"
              echo "       Read the last line printed for each above: it says whether the"
              echo "       brain never answered, is still on the previous build, or is on"
              echo "       this build but unhealthy. Only the first two are Coolify's."
              exit 1
            fi
            sleep 15
          done
          echo "[OK] every brain deployed by this run is serving ${EXPECTED}"
