name: deploy
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.5.x" }
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/alobarquest/change-manager:main
            ghcr.io/alobarquest/change-manager:${{ github.sha }}
      - name: Trigger Coolify redeploy
        run: |
          curl -fsSL -X GET \
            "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"

      # The trigger above succeeds the moment Coolify ACCEPTS it — it says nothing about
      # whether the build finished, the container started, or the app came back. Until
      # this step existed, a merge that broke production reported a green pipeline.
      #
      # Polling for `status == "ok"` alone would not fix that: Coolify serves the OLD
      # container throughout the swap, so a liveness poll returns 200 the whole time and
      # passes whether or not the new image ever ran. The check is therefore on the
      # REVISION — it waits until the deployed build reports the commit just pushed.
      - name: Verify the new revision is live
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          url=https://change-mgr.alobar.net/api/health
          deadline=$(( SECONDS + 600 ))
          seen=""
          until [ "$SECONDS" -ge "$deadline" ]; do
            body=$(curl -sf --max-time 10 "$url" || true)
            seen=$(printf '%s' "$body" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("revision",""))' 2>/dev/null || true)
            if [ "$seen" = "$EXPECTED" ]; then
              echo "[OK] $EXPECTED is live and healthy"
              exit 0
            fi
            echo "  serving revision '${seen:-<unreachable>}', waiting for ${EXPECTED}..."
            sleep 15
          done
          echo "[FAIL] ${EXPECTED} did not become live within 10 minutes;" \
               "last seen '${seen:-<unreachable>}'. Production may be serving the previous" \
               "build, or may be down. Check the Coolify deployment log before merging" \
               "anything else."
          exit 1
