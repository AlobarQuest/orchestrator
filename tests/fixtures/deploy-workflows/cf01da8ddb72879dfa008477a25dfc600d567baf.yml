# Required repo Actions secrets:
#   COOLIFY_WEBHOOK_URL       — base URL for the Coolify deploy webhook
#   COOLIFY_API_TOKEN         — Coolify API bearer token
#   COOLIFY_APP_UUID_INFRA    — Coolify app UUID for infra-brain
#   COOLIFY_APP_UUID_OPEN     — Coolify app UUID for open-brain
#   COOLIFY_APP_UUID_APP      — Coolify app UUID for app-brain
#
# These secrets are provisioned at cutover (Task 17). The build-and-push and
# deploy jobs are guarded to main-push only, so this workflow is safe to merge
# on a PR before secrets exist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/alobarquest/brain

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate local compose
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Run tests
        run: pytest -x -q

  build-and-push:
    needs: test
    # PRs run tests only — build and deploy only on a real merge to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy all three brain apps
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          UUID_INFRA: ${{ secrets.COOLIFY_APP_UUID_INFRA }}
          UUID_OPEN: ${{ secrets.COOLIFY_APP_UUID_OPEN }}
          UUID_APP: ${{ secrets.COOLIFY_APP_UUID_APP }}
        run: |
          for entry in "infra:${UUID_INFRA}" "open:${UUID_OPEN}" "app:${UUID_APP}"; do
            name="${entry%%:*}"
            uuid="${entry##*:}"
            echo "Triggering deploy for ${name}-brain (uuid=${uuid})..."
            curl -f -X GET "${WEBHOOK_URL}?uuid=${uuid}&force=false" \
              -H "Authorization: Bearer ${API_TOKEN}"
          done

      - name: Health-check all three brain apps
        run: |
          echo "Waiting 30s for deployments to start..."
          sleep 30
          for name in infra open app; do
            domain="${name}-brain.devonwatkins.com"
            echo "Polling https://${domain}/api/health ..."
            for i in 1 2 3 4 5; do
              if curl -sf "https://${domain}/api/health" > /dev/null 2>&1; then
                echo "  [OK] ${name}-brain healthy on attempt ${i}"
                break
              fi
              if [ "${i}" -eq 5 ]; then
                echo "  [FAIL] ${name}-brain did not become healthy after 5 attempts"
                exit 1
              fi
              echo "  Attempt ${i} failed, waiting 15s..."
              sleep 15
            done
          done
