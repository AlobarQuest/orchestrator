# Every file git tracks in this repository belongs to exactly one layer.
# `tests/architecture/test_layer_manifest.py` fails on a file no layer claims or two layers claim.
# List a layer's files with `make layer L=<id>`; see the counts with `make layers`.
#
# Patterns are matched against the path from the repository root with
# `PurePosixPath.full_match`: `*` stays within one path segment and `**` spans any number.
# Placement rules: a source file belongs to its directory's layer; a test, fixture, launcher
# or operations page goes with the code it serves; a per-domain route and schema go with
# their domain's service.

