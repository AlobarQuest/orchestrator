basis = "live"
argv = ["python3", "scripts/exit_probe.py", "unmeasured", "no single production chain spans every hop: a PR-producing unit's chain carries `pr` and no release binding, and the deploy-verification units carrying the binding never had a PR. Whether 'end-to-end' requires one chain to span all of it is an open ruling, so this clause is recorded as unmeasured rather than resolved in the passing direction."]
unavailable_exit_codes = [7]
proves = "nothing -- it declares that the clause's 'end-to-end' reading is unresolved"

