# The required hops are declared HERE, not chosen inside the probe, because which hops make a
# chain "end-to-end" is a judgment and hiding it in code would be the summarising move.
# Measured 2026-08-05: no single production chain spans every hop. A PR-producing unit's chain
# carries `pr` and no release binding; the deploy-verification units that carry the binding never
# had a PR. So `pr`, `conditions` and `observations` are deliberately NOT required here, which
# matches what the Wave-2 closeout demonstrated -- and the probe reports the full hop census
# every run, so the discontinuity is visible rather than assumed away. Whether "end-to-end"
# should mean one chain spanning all of it is Devon's call, not this file's; see the WS-P2.39
# build report.
[[bar.clause.check]]
kind = "command"
basis = "live"
argv = ["python3", "scripts/exit_probe.py", "traceability-answers-for-a-real-release", "intent", "unit", "commit", "artifact", "deployment"]
unavailable_exit_codes = [7]
proves = "a production-anchored chain resolves intent -> unit -> commit -> artifact -> deployment, and the full hop census is reported rather than passed over"
[[bar.clause.check]]
