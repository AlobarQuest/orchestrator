# The Phase-2 wave exit bars, clause by clause, pinned to the plan that defines them.
#
# WHY THIS FILE IS SHAPED LIKE THIS. The programme's most persistent failure is reasoning from a
# summary of a rule instead of the rule: criteria #5, #6 and #7 were each marked MET on evidence
# that did not support them, and Wave 3's four-clause bar was tracked as three for two days. A
# manifest holding a *paraphrase* of each bar would be the fifth summary. So each bar carries a
# VERBATIM MIRROR of the plan's sentence (`body`), and the clause list must reconstruct that
# mirror exactly, character for character:
#
#     clause[0].text + clause[0].annotation
#       + clause[1].separator + clause[1].text + clause[1].annotation + …   ==   body
#
# A clause dropped here makes the reconstruction short; a clause added or reworded in the plan
# makes `body` disagree with the source. Either is a hard failure, and neither can be reached by
# editing this file alone. `scripts/attest_wave_exit.py` checks both, and refuses to report any
# clause result while the pin is broken.
#
# RECONSTRUCTION IS EXACT BUT NOT UNIQUE, and the non-unique dimension is exactly the
# hide-a-clause dimension. Adversarial review found three routes by which a clause vanished from
# the count while the bar stayed byte-identical -- absorbed into a neighbour's `annotation`, into
# an override `separator`, or into a single clause under a `clause_separator` that never occurs
# in the bar at all. All three are now refused at load, and two further declarations close the
# gap for good:
#   * `clause_count` -- stated per bar and asserted. It is the number this whole file exists to
#     protect ("four, not three"), so changing it must be a visible edit rather than an emergent
#     property of how the clauses happen to be written.
#   * `annotation_separator_count` -- an annotation may carry the separator (Wave 1's closure
#     note genuinely does), but it must declare how many times. Every occurrence of the separator
#     in the bar is then accounted for as either a clause boundary or a declared annotation
#     occurrence; an unaccounted one is a boundary nothing is measuring.
#
# `text` is the NORMATIVE half -- the rule a check must demonstrate. `annotation` is the status
# commentary the plan carries inline (`**(✅ 5 drills)**`, closure notes). Both are verbatim; the
# split exists so a check aims at the rule rather than at a sentence that also records who closed
# it.
#
# The pin covers the bar's PARAGRAPH, not its line: appending a sentence underneath a bar is the
# ordinary way a plan grows, and a line-scoped pin cannot see it.
#
# THE MIRROR IS NOT A CONVENIENCE. The authoritative plan lives in `~/docs`, which is neither this
# repository nor reachable from CI, so the pin has two layers: clauses-reconstruct-the-mirror runs
# everywhere, and mirror-equals-the-plan runs wherever the plan is readable. When it is not, the
# tool reports that layer `unavailable` and the run is INCONCLUSIVE -- never quietly passing.
#
# EDITING. Change a bar only when the plan changed, and in the same commit restate `body`,
# `body_sha256` and whichever clauses moved. Never adjust a clause to make a check pass: the
# clause is the rule, and a check that cannot demonstrate it should say `unavailable`.
#
# Checks: `command` (argv; exit 0 met, 1 not met, anything in `unavailable_exit_codes` or matching
# `unavailable_pattern` unmeasurable), `retained_evidence` (a named artifact still hashing to what
# was recorded), `routes_served` (production serves these paths). `basis` records whether a check
# re-measures the fact now (`live`) or establishes that the historical record of it is intact
# (`retained`) -- some clauses are about events that happened once and cannot be re-run.
#
# `proves` IS THE SENTENCE THE RETAINED RECORD ASSERTS WAS DEMONSTRATED. It is written into the
# record verbatim on pass, so it is not a comment: an overclaiming `proves` is the same defect
# this file exists to eliminate, one level down. Write what the code establishes, name a
# necessary condition as necessary, and where a named part of a clause is reached by no probe,
# declare it with the `unmeasured` probe so the clause reports `unavailable` instead of passing
# on the narrower property.

schema_version = 1
authoritative_source = "~/docs/software-delivery-system/2026-07-09-program-phase2-post-mvp-plan.md"

