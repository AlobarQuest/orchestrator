# Route-citing claims from the Program Phase 2 exit-criteria scorecard
# (~/docs/software-delivery-system/2026-07-09-program-phase2-post-mvp-plan.md, Part 3).
#
# This manifest is the machine-checkable side of remediation item 0.5: every scorecard cell
# whose status rests on "this route is live in production" is listed here, and
# scripts/attest_exit_criteria.py fails when production stops serving any of them.
# When a scorecard cell gains or loses a route citation, update this file in the same change.

[[claim]]
criterion = 5
status = "met"
description = "Recovery drills exercised against production (2026-07-27, 5/5 PASS, none waived)"
# The routes the 2026-07-27 production drill run actually called -- one primary recovery control
# per drill, plus the read surfaces the run substituted for the local harness's direct SQL.
# Evidence: ~/docs/software-delivery-system/2026-07-27-production-recovery-drill-run.md;
# per-drill production variants: docs/operations/production-drill-adaptations.md.
routes = [
    # drill 1 -- orchestrator SIGKILLed after a lease was held
    "/api/v1/work-units/{unit_id}/reclaim-expired-claim",
    # drill 2 -- lease lapses after the work, before submit
    "/api/v1/work-units/{unit_id}/attempts/{attempt}/recover-evidence",
    # drill 4 -- a landed release whose post-release verification stalls
    "/api/v1/reconciliation/detect",
    # drill 5 -- a human approval gate nobody answers
    "/api/v1/dead-letter",
    # drill 3 read surface + post-run verification that nothing was left in flight
    "/api/v1/in-flight-units",
    # post-run verification: canonical state undiverged
    "/api/v1/consistency-check",
    # reader substitutions for scratch SQL
    "/api/v1/status-ledger",
    "/api/v1/traceability",
    "/api/v1/work-units/{unit_id}/evidence-pack",
]

[[claim]]
criterion = 6
status = "met"
description = "Traceability query live in production"
routes = ["/api/v1/traceability"]

[[claim]]
criterion = 7
status = "met"
description = "Operator status and recovery controls served AND exercised in production (2026-07-27 drill run, ADR-0005 disposition A)"
routes = [
    "/api/v1/dead-letter",
    "/api/v1/consistency-check",
    "/api/v1/reconciliation/detect",
    "/api/v1/work-units/{unit_id}/requeue",
    "/api/v1/work-units/{unit_id}/attempts/{attempt}/recover-evidence",
    "/api/v1/work-units/{unit_id}/pr-binding",
]

[[claim]]
criterion = 9
status = "met"
description = "Tracker projection surfaces live in production -- outbound (Inc 1) and inbound reconciliation (Inc 2)"
routes = [
    "/api/v1/work-units/{unit_id}/tracker-binding",
    "/api/v1/tracker-bindings",
    "/api/v1/reconciliation/tracker-detect",
]

[[claim]]
criterion = 13
status = "met"
description = "PR-binding chain surface live in production"
routes = ["/api/v1/work-units/{unit_id}/pr-binding"]
