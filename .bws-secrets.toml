# The shared observe-and-report bearer, consumed as the `orchestrator-observer` entry of
# ORCHESTRATOR_M2M_CREDENTIALS and mapped to the OBSERVER role by ORCHESTRATOR_M2M_ROLES.
# OBSERVER's entire write surface is POST /api/v1/observations; every other route refuses it
# (WS-P3.6 Increment 1, proven against production).
#
# IT CURRENTLY HOLDS THE SAME VALUE AS ORCHESTRATOR_DRIFT_REPORTER_TOKEN (Rotation / Keepers,
# 8998c4ea-453c-4ae1-9b5c-b49500b8dacc) -- identical sha256, verified 2026-08-08. Devon's
# deliberate choice: one bearer, two key ids, two agent_ids, so the drift digest keeps
# attributing to `drift-reconciler` while the landing ledger attributes to
# `orchestrator-observer`, without minting a second secret.
#
# ROTATION IS INDEPENDENT, and an earlier version of this comment said the opposite. These are
# two SEPARATE credentials that happen to share a value, not one credential with two copies:
# each has its own `token_hash` in ORCHESTRATOR_M2M_CREDENTIALS, so rotating one means updating
# that entry's hash alone and the other keeps working untouched. (The wrong claim came from
# pattern-matching FACTORY_PR_TOKEN, where seven repos hold copies of ONE credential and every
# copy is a consumer of it -- there, rotating the source really does mean re-setting all seven.)
#
# The genuine coupling is narrower: EXPOSURE is shared. A leak of this value is a leak of both,
# so a rotation prompted by exposure must cover both, or one stays live on a compromised secret.
#
# The one real weakness of sharing is that the agent_id becomes a label the caller selects by
# header rather than something the credential attests, since one value satisfies both entries.
# That is acceptable only because both identities are OBSERVER and observe-only -- identical
# blast radius -- and it DISSOLVES at the first rotation of either, after which each value
# authenticates as exactly one identity. Do not extend the pattern to a credential that can
# change anything.
#
# Both copies live in `Rotation / Keepers` (moved 2026-10-18, ADR-0055 increment 6): the narrow
# read-only sds-operator account reads this one, and the broad machine account the drift-reporter
# copy, each by a direct grant on that one secret.
#
# Readers, each through the narrow identity: run-activation-sweep, run-bump-proposer,
# run-change-proposer, run-deploy-watcher, run-execution-watch, run-fork-harden, run-landing-ledger,
# run-membership-check, run-pin-watcher, run-revision-watcher, run-rotation-proposer,
# run-tool-installer and run-work-carrier, and on demand scripts/replay_deploy_signal.py.
[[secret]]
uuid = "f793576f-e9aa-4f9d-8089-b4a000b9e2d5"
name = "orchestrator-observer"
project = "Rotation / Keepers"

# The hosting platform's API token, consumed by `scripts/run-revision-watcher.sh` and by
# nothing else in this repository. That script uses it for exactly one call -- listing applications --
# and only to police that lane's declared subject table: an application the platform runs, absent from
# the table, that answers with a revision is reported so the table cannot rot silently.
#
# It lives in `Ops / Platform`, which the narrow read-only `sds-operator` account CANNOT read.
# Measured 2026-09-08, both directions: the narrow identity reads the observer bearer above and is
# denied this one; the broad identity reads this one and is denied the observer bearer. That is why
# the launcher names two identities explicitly instead of letting one ambient BWS_ACCESS_TOKEN
# serve as both -- under which no value of it works, and the failure appears only in an operator's
# shell rather than under launchd.
#
# Its owning repository is `infraops-mcp-server`, whose manifest declares it too. Declared here as
# well because this repository now consumes it, and a manifest that omits a UUID its code fetches
# is the drift the scanner exists to report.
#
# It is NOT read-only: measured 2026-11-05, `POST /api/v1/applications/<uuid>/envs` with it returned
# 201, so it can write environment variables. The orchestrator's alert-hub token was written to
# Coolify with it that day.
[[secret]]
uuid = "bbd71f41-b7df-4ae9-8fdb-b41501447308"
name = "prod-coolify-api-token"
project = "Ops / Platform"

