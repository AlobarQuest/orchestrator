# Private key (base64 PEM) of the "Alobar SDS Dispatch" GitHub App, app_id 4259746,
# installation_id 145535298 on exactly the six WS-6.4 fan-out repos (WS-6.4.0c,
# 2026-07-09). Consumed as ORCHESTRATOR_GITHUB_APP_PRIVATE_KEY_B64; the orchestrator
# mints hourly installation tokens from it. app_id and installation_id are not secret
# and are set as plain Coolify env vars.
[[secret]]
uuid = "8c36c6e6-8658-48a5-8e4f-b4820160560f"
name = "orchestrator-github-app-private-key-b64"
project = "Ops / Platform"

# Durable ActorRole.VERIFIER bearer token. Consumed as the `orchestrator-verifier` entry of
# ORCHESTRATOR_M2M_CREDENTIALS (Coolify stores only sha256(token)) and mapped to the verifier role
# by ORCHESTRATOR_M2M_ROLES. It is what adjudicates acceptance criteria.
#
# It was LIVE IN PRODUCTION but missing from this manifest until 2026-07-12 — found while running
# WS-P2.1 through the factory's own gates. A credential the manifest does not name is a credential
# the drift scanner cannot watch, which is precisely what the manifest exists to prevent.
[[secret]]
uuid = "660d5846-abcb-4751-be86-b483012899eb"
name = "orchestrator-verifier-bearer"
project = "Ops / Platform"

# Todoist REST API token consumed by the out-of-process tracker projection adapter
