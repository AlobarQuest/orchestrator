# Secrets this repo consumes through production/runtime or GitHub Actions, by stable BWS UUID.
consumption = "environment-injection"

[[secret]]
uuid = "d2a4c0fc-128b-4bf5-8e25-b481010e1be0"
name = "orchestrator-factory-runner-github-M2M_TOKEN"
project = "Ops / Platform"

# Durable ActorRole.SYSTEM bearer token (WS-6.4a, 2026-07-09). Consumed as the
# orchestrator-system entry of ORCHESTRATOR_M2M_CREDENTIALS: Coolify stores only
# sha256(token); the token itself is never written to Coolify or to this repo.
# The BWS key is currently named ORCHESTRATOR_M2M_CREDENTIALS, which is the env
# var it feeds rather than what it is (an opaque bearer token). Renaming it in
# BWS is safe -- this manifest and every consumer reference it by UUID.
[[secret]]
uuid = "221a48d5-3f29-4898-b300-b4820140c880"
name = "ORCHESTRATOR_M2M_CREDENTIALS"
project = "Ops / Platform"

# Spend-capped key used only by factory runners, in all six WS-6.4 fan-out repos
# (WS-6.4a, 2026-07-09). Replaces the shared primary key, which is no longer this
# repo's ANTHROPIC_API_KEY Actions secret.
[[secret]]
uuid = "b56cf0df-27bc-46a8-8e94-b48201478aff"
name = "anthropic-key-sys-orchestrator"
project = "Ops / Platform"

