name = "TODIST-API-DEVON-PERSONAL"
project = "SDS Operator"

# ActorRole.WORKER bearer, agent_id `claude-code-interactive`. Consumed as the
# `orchestrator-operator` entry of ORCHESTRATOR_M2M_CREDENTIALS (Coolify stores only
# sha256(token)); no ORCHESTRATOR_M2M_ROLES entry, because WORKER is the default every
# unpromoted credential falls to.
#
# Minted 2026-07-30 (WS-P2.13) because a unit cannot reach COMPLETED without a WORKER actor
# (CLAIMED->EXECUTING and EXECUTING->SUBMITTED are worker-only edges) and production's only
# worker credential attributes to `factory-runner` — untrue for non-software operational work,
# and agent_id attribution is permanent.
[[secret]]
uuid = "bd71bed1-4aac-4af8-9094-b4970180bc59"
name = "orchestrator-operator-bearer"
project = "SDS Operator"

# The shared observe-and-report bearer, consumed as the `orchestrator-observer` entry of
# ORCHESTRATOR_M2M_CREDENTIALS and mapped to the OBSERVER role by ORCHESTRATOR_M2M_ROLES.
# OBSERVER's entire write surface is POST /api/v1/observations; every other route refuses it
# (WS-P3.6 Increment 1, proven against production).
#
# IT HOLDS THE SAME VALUE AS ORCHESTRATOR_DRIFT_REPORTER_TOKEN (Ops / Platform,
# 8998c4ea-453c-4ae1-9b5c-b49500b8dacc) -- identical sha256, verified 2026-08-08. Devon's
# deliberate choice: one bearer, two key ids, two agent_ids, so the drift digest keeps
# attributing to `drift-reconciler` while the landing ledger attributes to
# `orchestrator-observer`, without minting a second secret. Two consequences a future session
# must not have to rediscover: ROTATING EITHER MEANS ROTATING BOTH, since a stale copy is dead
# at the next run with no signal; and the agent_id is a label the caller selects by header
# rather than something the credential attests, because one value satisfies both entries. That
# is acceptable only because both identities are OBSERVER and observe-only -- identical blast
# radius. Do not extend the pattern to a credential that can change anything.
#
# This copy lives in the `SDS Operator` project so the narrow read-only sds-operator account can
# read it; the drift-reporter copy is in `Ops / Platform` and needs the broad machine account.
[[secret]]
uuid = "f793576f-e9aa-4f9d-8089-b4a000b9e2d5"
name = "orchestrator-observer"
project = "SDS Operator"
