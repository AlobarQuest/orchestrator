# scripts/run-tracker-projection.sh; never written to Coolify or this repo. The adapter
# is operator-invoked (no scheduler yet, ADR-0003). Confirm `project` matches where the
# token lives in BWS.
[[secret]]
uuid = "ff396349-aec1-4250-b2f0-b493015188da"
name = "todoist-api-token-tracker-projection"
project = "Ops / Platform"
