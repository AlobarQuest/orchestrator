# .cred-consumers.toml — WS-0.7 rotation-lane consumer inventory for the credentials
# this repository OWNS: the M2M bearers the orchestrator authenticates, and the
# read-only sds-operator BWS machine token its launchers bootstrap with.
#
# Read by infraops-mcp-server's nightly security-drift run (src/security-drift/
# cred-rotation.ts) once this file's absolute path is listed in
# ~/.config/infra-drift/cred-consumers.list. Schema, consumer kinds and the strict
# subset-TOML rules are documented in infraops-mcp-server/.cred-consumers.toml.
# Complements .bws-secrets.toml: that file says which secrets this repo consumes;
# this one says, per credential, what must be updated and verified on rotation.
#
# NO entry here carries consumers_verified: none has been fingerprint-swept. An entry
# marked rotated_by_sds is rotated by the rotation executor (ADR-0055), which verifies
# each scheduled reader by the read its row names (`healthchecks_check`, beside `note`);
# every other entry falls to the manual checklist (deny-by-default). Values NEVER appear here.
#
# Each orchestrator reader list comes from a grep of the credential's BWS UUID (or, for
# the sds-operator token, its Keychain item name) across scripts/ and src/.
#
# Dates are BWS creationDate. The three secrets moved into the SDS Operator project on
# 2026-07-30 show that day as revisionDate; the move did not change their values
# (2026-07-30 migration-plan closure: sha prefixes identical), so it is not a rotation.

version = 1

# ── sds-operator BWS machine token ───────────────────────────────────────────────
# Read-only machine account sds-operator. It reads the SDS Operator project
# (b09acc9d-87af-4830-9361-b49700d2bc8a), and the operator and observer keepers in
# Rotation / Keepers by a direct grant on each of those two secrets. Minted 2026-07-30 (Keychain item created
# that day). sha256[:8] computed in-process 2026-10-06.
[[credential]]
id = "bws-sds-operator-token"
class = "bws-machine-token"
fingerprint_sha256_8 = "e906c40f"
provider = "bitwarden-sm"
provider_identity = "Bitwarden SM machine account sds-operator (read-only, SDS Operator project), access-key 5d401526-…"
created = "2026-07-30"
disposition = "reissue"
# A machine token has no BWS copy of itself, so its keeper is its one Keychain item.
keeper_service = "Claude"
keeper_account = "BWS_ACCESS_TOKEN_SDS"
# Handed to the rotation executor 2026-10-29 (Devon). The Mac instance reads its scheduled
# readers' checks with the self-hosted Healthchecks read-only key, copied into its Keychain.
rotated_by_sds = true

  [[credential.consumer]]
  kind = "keychain"
  service = "Claude"
  account = "BWS_ACCESS_TOKEN_SDS"
  note = "the keeper. Every reader reads it fresh on each run, so it switches with the item. Scheduled readers with a Healthchecks check are the rows below. Verified by this item's read-back alone (Devon, 2026-10-23): infraops-mcp-server scripts/drift-audit.sh's mint-follow-ups step, whose check pings success when the read fails; and on demand, scripts/deploy_orchestrator.py, scripts/exit_probe.py, scripts/replay_deploy_signal.py, infraops-mcp-server scripts/cred-consumer-sweep.py, and factory-validation-kit-restart-recovery, which inherits an ambient BWS_ACCESS_TOKEN when run by hand"

