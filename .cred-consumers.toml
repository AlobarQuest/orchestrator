disposition = "reissue"

  [[credential.consumer]]
  kind = "bws-secret"
  uuid = "8998c4ea-453c-4ae1-9b5c-b49500b8dacc"
  note = "ORCHESTRATOR_DRIFT_REPORTER_TOKEN (Ops / Platform) — keeper"

  [[credential.consumer]]
