# The observer and drift-reporter bearers are two credentials that currently share
# ONE value (identical sha256, verified 2026-08-08). Rotation is independent (each key
# id has its own hash entry) but EXPOSURE is shared: an exposure recorded on one must
# be recorded on both, or one stays live on a compromised value. Both are aged from
# 2026-07-28, when the shared value was created (drift-reporter BWS record); the
# observer's own BWS record was created 2026-08-08.
# Each scheduled reader is its own runtime-fetch row (census 2026-10-16 over ~/Projects,
# ~/.claude/bin and hooks, ~/Library/LaunchAgents, crontabs, both OrbStack machines and
# the VPS), so each can be verified on its own. `ref` names the file; the schedule,
# Keychain item and Healthchecks check live in `note`, which no destination compares.
# The sds-operator account reads only the observer value, and the one broad account
# behind BWS_ACCESS_TOKEN_VPS_BACKUP and BWS_ACCESS_TOKEN_INFRA_DRIFT reads only the
# drift-reporter value (probed with an empty HOME, 2026-10-16). Both keepers moved to
# Rotation / Keepers on 2026-10-18, each read there by its one account's direct grant.
# The observer rotates first, without an overlap; the drift-reporter is marked
# rotated_by_sds only after the observer's mint unit completes (ADR-0055 amendment 9).

[[credential]]
id = "orchestrator-observer-bearer"
class = "orchestrator-m2m-bearer"
provider = "orchestrator"
provider_identity = "key id orchestrator-observer, ActorRole.OBSERVER (shared its value with orchestrator-drift-reporter-bearer until the 2026-10-20 rotation)"
bws_uuid = "f793576f-e9aa-4f9d-8089-b4a000b9e2d5"
created = "2026-10-20"
disposition = "reissue"
# Rotated by the rotation executor 2026-10-20 to 2026-10-21 (units a7649b61 and a5465f19): new
# value sha256 6640e02a, hosted with no overlap because the drift-reporter entry held the old value.
# Request cleared.
rotated_by_sds = true

