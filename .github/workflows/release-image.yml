name: Release image
# The deploy command (scripts/deploy_orchestrator.py) finds the run it dispatched by this title, so
# it names the commit being built. `gh workflow run` returns no run id to attribute by.
run-name: Release image ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: orchestrator commit or branch to build
        required: true
        default: main
      label:
        description: optional tag suffix (e.g. wsp26)
        required: false
        default: ""
      allow_overwrite:
        description: >-
          Re-point an EXISTING tag at fresh bytes. Only for a deliberate rebuild
          (e.g. a base-image CVE under an unchanged tree). Default refuses.
        required: false
        default: "false"

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # This job runs five `python3` steps against files in this tree, and until 2026-09-09 it
      # ran them on the runner's system interpreter -- `ubuntu-latest` is 24.04, which ships
      # 3.12.3. That was survivable only by accident: nothing this job executes had yet been
      # rewritten into 3.14-only syntax. It would not have stayed survivable, because
      # `[tool.ruff]` sets no `target-version` and derives its format target from
      # `requires-python`, so the next `except`-tuple edited into either script would have been
      # reformatted under PEP 758 and killed the production image build with a SyntaxError.
      # This step must precede the first `python3` use below, and
      # `test_every_job_running_runner_python_sets_it_up_before_the_first_use` enforces both
      # halves -- that it is here at all, and that it is here FIRST.
      #
      # CONDITIONAL BECAUSE THIS WORKFLOW BUILDS AN ARBITRARY `inputs.ref`. `.python-version`
      # was created on 2026-09-09, so no earlier commit carries it -- including the one
      # production is serving today -- and `python-version-file` THROWS on a missing path rather
      # than warning. An unconditional step would therefore turn the deliberate-rebuild path
      # `allow_overwrite` exists for (a base-image CVE under an unchanged tree) into a hard
      # failure at step two for every image ever built. Skipping it there restores exactly the
      # interpreter those trees were always built with, and asks the built tree what it pins
      # rather than writing a second copy of a number here.
      - name: Set up Python
        if: hashFiles('.python-version') != ''
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # A STATIC guard cannot see whether the step above actually ran: if `hashFiles` returned ''
      # for a path it should have matched, or the condition were ever inverted, the step would
      # skip, `python3` would silently be the runner's system 3.12, and every check would stay
      # green. This asserts it where it matters and derives the expected value from the file
      # rather than repeating it. Skipped for a revision that predates the pin, which is the same
      # tree the step above deliberately skips for.
      - name: Confirm python3 is the interpreter this tree pins
        run: |
          # The messages below say "the interpreter" rather than naming the binary: a bare
          # `python3` token in an echo is reported by the guard that watches this file, and
          # rewording is this repository's answer to that rather than an exemption.
          if [ ! -f .python-version ]; then
            echo "::notice::this revision predates .python-version; using the runner's default"
            exit 0
          fi
          want="$(cat .python-version)"
          got="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$got" != "$want" ]; then
            echo "::error::the interpreter is $got but this tree pins $want -- setup did not run"
            exit 1
          fi
          echo "the interpreter is $got, as .python-version requires"

      - name: Read pin
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          pin = tomllib.load(open("security-standards.pin.toml", "rb"))
          print(f"revision={pin['revision']}")
          print(f"digest={pin['artifact_sha256']}")
          PY

      - name: Checkout security-standards @ pin
        uses: actions/checkout@v7
        with:
          repository: AlobarQuest/security-standards
          ref: ${{ steps.pin.outputs.revision }}
          ssh-key: ${{ secrets.SECURITY_STANDARDS_DEPLOY_KEY }}
          path: security-standards
          fetch-depth: 0

      - name: Shape registry build-context
        run: |
          python3 scripts/shape_registry_context.py \
            --source security-standards \
            --revision "${{ steps.pin.outputs.revision }}" \
            --output "$RUNNER_TEMP/registry"

      # `github.sha` is the sha of the ref the workflow file was read from, not of `inputs.ref`;
      # only the checked-out HEAD is the commit actually being built.
      - name: Compute tags
        id: tag
        env:
          LABEL: ${{ inputs.label }}
        run: |
          python3 scripts/compute_image_tags.py \
            --revision "$(git rev-parse HEAD)" \
            --label "$LABEL" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The lane image (ADR-0059) takes the orchestrator's tag names in its own repository, so a
      # lane's `SDS_LANES_IMAGE_TAG` is the served orchestrator tag. Computed before any build, so
      # the overwrite refusal below covers both images before either is pushed.
      - name: Compute the lane image's tags
        id: lane_tag
        env:
          LABEL: ${{ inputs.label }}
        run: |
          python3 scripts/compute_image_tags.py --image lanes \
            --revision "$(git rev-parse HEAD)" \
            --label "$LABEL" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # A tag that can be silently re-pointed is not an identity. Rebuilding a commit is a
      # legitimate thing to want -- a base-image CVE lands underneath an unchanged tree -- but it
      # produces DIFFERENT BYTES under the same name. That is measured rather than theoretical:
      # WS-P2.18 Inc 7 built one commit twice and got digests da035e69... and a0936e08..., because
      # `org.opencontainers.image.created` moves and `python:3.14-slim` moves underneath it. The
      # runtime is pointed at a TAG, so a silent re-point can change what production serves with
      # nothing visible having happened. So an overwrite must be a decision somebody made, not a
      # side effect of re-running a workflow. This runs before the build: a refusal should cost
      # seconds, not a full image build.
      - name: Refuse to overwrite an existing tag
        env:
          ALLOW: ${{ inputs.allow_overwrite }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
          # The lane image's names carry the `LANE_` prefix: `scripts/deploy_orchestrator.py`
          # reads every logged `SHA_TAG:` as the orchestrator's (ADR-0059 amendment 1, item 7).
          LANE_TAG: ${{ steps.lane_tag.outputs.tag }}
          LANE_SHA_TAG: ${{ steps.lane_tag.outputs.sha_tag }}
        run: |
          if [ "$ALLOW" = "true" ]; then
            echo "::warning::allow_overwrite=true -- existing tags may be re-pointed at fresh bytes"
            echo "overwrite_allowed=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          status=0
          for ref in "$SHA_TAG" "$TAG" "$LANE_SHA_TAG" "$LANE_TAG"; do
            [ -n "$ref" ] || continue
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              existing=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || echo "unknown")
              echo "::error::$ref already exists at $existing. Building would re-point it at different bytes. If that is what you intend, re-run with allow_overwrite=true."
              status=1
            fi
          done
          exit $status

      # Digest capture: `docker buildx build --push --metadata-file` writes the pushed
      # manifest digest (`containerimage.digest`) into a JSON file as part of the push
      # itself, which is reliable across BuildKit/Docker versions. Plain `docker build
      # --push` followed by `docker inspect --format '{{index .RepoDigests 0}}'` has been
      # observed to return an empty `RepoDigests` list immediately after push on some
      # Docker versions (the local image reference isn't always re-tagged with the
      # registry digest), so we do not rely on it as the primary source. `docker inspect`
      # is kept only as a defensive fallback in case the metadata file is ever absent.
      - name: Build and push (amd64; in-build digest gate fails closed)
        id: build
        run: |
          docker buildx build --platform linux/amd64 \
            --build-context registry="$RUNNER_TEMP/registry" \
            --build-arg SECURITY_STANDARDS_REVISION="${{ steps.pin.outputs.revision }}" \
            --build-arg REGISTRY_ARTIFACT_SHA256="${{ steps.pin.outputs.digest }}" \
            --build-arg ORCHESTRATOR_REVISION="${{ steps.tag.outputs.revision }}" \
            --label org.opencontainers.image.revision="${{ steps.tag.outputs.revision }}" \
            --label org.opencontainers.image.source="${{ steps.tag.outputs.source }}" \
            --label org.opencontainers.image.created="${{ steps.tag.outputs.created }}" \
            -t "${{ steps.tag.outputs.tag }}" \
            -t "${{ steps.tag.outputs.sha_tag }}" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --push .

          DIGEST=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('containerimage.digest',''))" "$RUNNER_TEMP/meta.json")
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.tag.outputs.tag }}" 2>/dev/null || true)
          fi
          # The two capture routes spell the digest differently (bare `sha256:...` vs a
          # `repo@sha256:...` reference); normalise so downstream steps compare like with like.
          DIGEST="sha256:${DIGEST##*sha256:}"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not capture pushed image digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # A label that exists in the build command and not in the pushed image proves nothing, so
      # this reads the artifact back out of the registry. Pulling the derivable tag proves both
      # halves at once: that the tag resolves to the digest just pushed, and that what it
      # resolves to asserts the commit it was built from.
      - name: Verify the pushed image asserts its own provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.tag.outputs.revision }}
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
        run: |
          docker pull --quiet "$SHA_TAG"
          RESOLVED=$(docker image inspect "$SHA_TAG" --format '{{index .RepoDigests 0}}')
          if [ "${RESOLVED##*@}" != "$DIGEST" ]; then
            echo "::error::$SHA_TAG resolves to ${RESOLVED##*@}, expected $DIGEST"
            exit 1
          fi
          LABELS=$(docker image inspect "$SHA_TAG" --format '{{json .Config.Labels}}')
          echo "$LABELS"
          LABELS="$LABELS" REVISION="$REVISION" python3 - <<'PY'
          import json
          import os
          import sys

          labels = json.loads(os.environ["LABELS"] or "null") or {}
          revision = os.environ["REVISION"]
          found = labels.get("org.opencontainers.image.revision")
          if found != revision:
              sys.exit(f"::error::revision label is {found!r}, expected {revision!r}")
          for key in ("org.opencontainers.image.source", "org.opencontainers.image.created"):
              if not labels.get(key):
                  sys.exit(f"::error::pushed image is missing {key}")
          print(f"pushed image asserts revision {revision}")
          PY

      # The lane image, FROM the orchestrator image just pushed, named by its digest, so the two
      # hold the same lane code (ADR-0059 decision 1). Its digest is captured as the
      # orchestrator's is. Every name this step and the next log carries a `LANE_` or
      # `ORCHESTRATOR_` prefix, never a bare `DIGEST:`, `REVISION:` or `SHA_TAG:`: the deploy
      # command refuses a run that logs a second distinct value of those (`pushed_digest`).
      - name: Build the lane image and push it (amd64)
        id: lane_build
        env:
          ORCHESTRATOR_SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
          ORCHESTRATOR_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f lanes/Dockerfile \
            --build-arg ORCHESTRATOR_IMAGE="${ORCHESTRATOR_SHA_TAG%:*}@${ORCHESTRATOR_DIGEST}" \
            --label org.opencontainers.image.revision="${{ steps.lane_tag.outputs.revision }}" \
            --label org.opencontainers.image.source="${{ steps.lane_tag.outputs.source }}" \
            --label org.opencontainers.image.created="${{ steps.tag.outputs.created }}" \
            -t "${{ steps.lane_tag.outputs.tag }}" \
            -t "${{ steps.lane_tag.outputs.sha_tag }}" \
            --metadata-file "$RUNNER_TEMP/lane-meta.json" \
            --push .

          LANE_PUSHED=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('containerimage.digest',''))" "$RUNNER_TEMP/lane-meta.json")
          if [ -z "$LANE_PUSHED" ]; then
            LANE_PUSHED=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.lane_tag.outputs.tag }}" 2>/dev/null || true)
          fi
          LANE_PUSHED="sha256:${LANE_PUSHED##*sha256:}"
          if ! printf '%s' "$LANE_PUSHED" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not capture the pushed lane image digest"
            exit 1
          fi
          echo "digest=$LANE_PUSHED" >> "$GITHUB_OUTPUT"

      # The lane image's provenance, read back out of the registry as the orchestrator's is. This
      # step's `env:` echo is where `pushed_lane_digest` reads `LANE_DIGEST:`, `LANE_REVISION:`
      # and `LANE_SHA_TAG:`.
      - name: Check the lane image's pushed provenance
        env:
          LANE_DIGEST: ${{ steps.lane_build.outputs.digest }}
          LANE_REVISION: ${{ steps.lane_tag.outputs.revision }}
          LANE_SHA_TAG: ${{ steps.lane_tag.outputs.sha_tag }}
        run: |
          docker pull --quiet "$LANE_SHA_TAG"
          RESOLVED=$(docker image inspect "$LANE_SHA_TAG" --format '{{index .RepoDigests 0}}')
          if [ "${RESOLVED##*@}" != "$LANE_DIGEST" ]; then
            echo "::error::$LANE_SHA_TAG resolves to ${RESOLVED##*@}, expected $LANE_DIGEST"
            exit 1
          fi
          FOUND=$(docker image inspect "$LANE_SHA_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ "$FOUND" != "$LANE_REVISION" ]; then
            echo "::error::lane image revision label is $FOUND, expected $LANE_REVISION"
            exit 1
          fi
          echo "pushed lane image asserts revision $LANE_REVISION"

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "- Derivable tag: \`${{ steps.tag.outputs.sha_tag }}\` (a function of the commit alone)"
            echo "- Readable tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Asserts \`org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}\`, verified by reading the pushed image back from the registry."
            echo "- Lane image derivable tag: \`${{ steps.lane_tag.outputs.sha_tag }}\`"
            echo "- Lane image readable tag: \`${{ steps.lane_tag.outputs.tag }}\`"
            echo "- Lane image digest: \`${{ steps.lane_build.outputs.digest }}\`, built FROM the orchestrator digest above."
            echo ""
            if [ "${overwrite_allowed:-no}" = "yes" ]; then
              echo "- ⚠️ **Built with \`allow_overwrite=true\`** — an existing tag may have been re-pointed at these bytes."
              echo ""
            fi
            echo "Both tags point at the same digest. Rebuilding this commit reproduces the derivable tag name, but re-points it at a fresh digest; the digest above is the artifact's identity — which is why an overwrite now requires \`allow_overwrite=true\`."
            echo ""
            echo "This workflow only builds and pushes the image. Pointing the runtime at a tag is a separate, manual step; verify the running container's image digest matches the digest above after doing so."
          } >> "$GITHUB_STEP_SUMMARY"
