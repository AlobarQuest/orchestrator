# The rotation executor (orchestrator ADR-0055 increment 7) reads this workflow's log to confirm
# each Actions secret holds the value it wrote. It prints a sha256 prefix and a length, hashed the
# way the executor hashes (the exact bytes, no newline), and never the value. It needs no token.
name: Secret fingerprint
on:
  schedule:
    - cron: "17 * * * *"
permissions: {}
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report each secret's fingerprint
        env:
          FACTORY_PR_TOKEN: ${{ secrets.FACTORY_PR_TOKEN }}
          FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
        run: |
          for name in FACTORY_PR_TOKEN FACTORY_RUNNER_TOKEN; do
            value="${!name}"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-8)"
            echo "fingerprint $name $digest ${#value}"
          done
