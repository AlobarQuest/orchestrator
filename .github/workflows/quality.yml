# LOCALLY OWNED (no code-standards managed block, deliberately). This workflow is
# this repo's own: the WS-P2.23 "Runner brief compatibility" job, a postgres:16
# service, SECURITY_STANDARDS_DIR, both database URLs and `alembic upgrade head`.
# None of it exists in the shared template and `make check` cannot run here
# without it. `code-standards sync` writes nothing here and reports it every run
# (ADR-0008); before that mechanism existed, a literal sync would have deleted a
# shipped CI gate.
name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Separate from Quality on purpose. It answers a different question -- can the consumer
  # this repo is pinned to actually use the brief this branch would serve? -- and it must
  # answer it on the pull request that adds the field, not on a later release. It needs no
  # database and no dependency install, so it also reports in seconds rather than behind
  # the full gate. A red here is unambiguous: merge the consumer first.
  brief-compatibility:
    name: Runner brief compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"

      # The locked environment, not an ad-hoc pin: a second declaration of the YAML
      # parser's version is a second vocabulary, and this repo has been bitten by those.
      - name: Install locked dependencies
        run: uv sync --frozen

      # Read-only: two GETs of a public repository at the pinned revision.
      - name: Check served brief fields against the pinned consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/check_brief_consumer_compatibility.py

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ORCHESTRATOR_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/orchestrator_test
      SECURITY_STANDARDS_DIR: ${{ github.workspace }}/tests/fixtures/security-standards
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/orchestrator_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Upgrade empty database
        run: uv run alembic upgrade head

      - name: Run full quality gate
        run: PATH="$PWD/.venv/bin:$PATH" make check

      - name: Build fixture-registry image
        run: >-
          docker build
          --build-context registry=tests/fixtures/security-standards
          --build-arg SECURITY_STANDARDS_REVISION=0123456789abcdef0123456789abcdef01234567
          --build-arg REGISTRY_ARTIFACT_SHA256=258e4757bf84361afe847dc72ecc83452b4229d699dbf593fad50e365e80fbce
          -t orchestrator:quality .
