# LOCALLY OWNED (no code-standards managed block, deliberately). This workflow is
# this repo's own: the WS-P2.23 "Runner consumer compatibility" job, a postgres:16
# service, SECURITY_STANDARDS_DIR, both database URLs and `alembic upgrade head`.
# None of it exists in the shared template and `make check` cannot run here
# without it. `code-standards sync` writes nothing here and reports it every run
# (ADR-0008); before that mechanism existed, a literal sync would have deleted a
# shipped CI gate.
name: Quality

# `push` is main-only ON PURPOSE. With `branches: ["**"]` on both events, every commit on
# a branch with an open PR ran this workflow TWICE -- once per event, same SHA, same name.
# That doubled a ~13-minute billed job on a private repo, and it is also the cause of the
# two indistinguishable `Quality` runs on one SHA: the named-check evidence mechanism
# records a check by NAME, so it could not tell the pair apart. One run per commit is a
# correctness property here, not only a cost saving.
#
# Consequence, accepted: a branch pushed with no open PR gets no CI. Signal arrives when the
# PR is opened, which is when it is read. `main` is still verified on every push, so a merge
# is never unverified.
on:
  push:
    branches: [main]
  pull_request:
  # A daily run of this same gate against the default branch, added 2026-08-15.
  # The Dependabot cascade arms with the token the CI platform supplies, and a landing
  # made with that token fires no `push` event -- so a bump can reach `main` with this
  # gate never having run on the result. Asking the question on a clock closes that
  # hole without changing which identity lands the pull request.
  #
  # It does NOT attribute a failure to the commit that caused it: a red scheduled run
  # means bisecting the day's landings. That is the accepted cost of leaving the
  # arming identity alone; the tightening that would remove it is a separate decision.
  #
  # The minute is off the hour on purpose -- runs queued at :00 are delayed -- and is
  # staggered against the other five lane repositories. Times are UTC: 10:23 is after
  # the 02:00-06:00 window in which this estate lands changes unattended, so an
  # overnight landing is checked the same morning.
  schedule:
    - cron: "23 10 * * *"

# A superseded run has nothing to say. Cancel in-progress runs for a PR branch when a new
# commit lands -- but NEVER on `main`, where each commit's result is a record of that commit
# and cancelling one would leave a merged SHA with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Separate from Quality on purpose. It answers a different question -- can the consumer
  # this repo is pinned to actually use the brief this branch would serve? -- and it must
  # answer it on the pull request that adds the field, not on a later release. It needs no
  # database and no dependency install, so it also reports in seconds rather than behind
  # the full gate. A red here is unambiguous: merge the consumer first.
  consumer-compatibility:
    name: Runner consumer compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.31"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The locked environment, not an ad-hoc pin: a second declaration of the YAML
      # parser's version is a second vocabulary, and this repo has been bitten by those.
      - name: Install locked dependencies
        run: uv sync --frozen

      # Read-only: two GETs of a public repository at the pinned revision.
      - name: Check served brief fields against the pinned consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/check_brief_consumer_compatibility.py

      # The same question about the other cross-repo vocabulary (WS-P3.7). It lives in THIS
      # job rather than its own so that the required status check already protecting the
      # brief answer protects this one too: a new job would report but not block until
      # branch protection was edited to require it, and a gate that does not block is a
      # report. The job NAME is therefore left alone -- it is the protected context string,
      # and renaming it silently blocks every pull request forever. Reading the name as
      # covering both surfaces is the cost; renaming it and the protection rule together is
      # a follow-up, not something to do halfway.
      #
      # Invoked as a MODULE, unlike its sibling above, so that it can import the pin reader,
      # the fetcher and the premise assertion from it. Two readers of one pin could vet two
      # different revisions.
      - name: Check declared capabilities against the pinned consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m scripts.check_capability_consumer_compatibility

      # The THIRD surface, and the first that points the other way: a convention the consumer
      # PRODUCES and this repo consumes. `change_proposer` recognises a factory pull request by
      # the title the runner stamps on it, and if that format moves the recognition silently
      # stops matching -- no change record, no landing lane, no unit-scoped observation, and
      # nothing red. Same job as its two siblings for the same reason: the required status check
      # already protecting them protects this one too, and the job NAME stays as it is because
      # it is the protected context string.
      #
      # A consumer-side pin on a producer-side convention cannot fire the moment the runner
      # changes. It fires here on every pull request and on the daily scheduled run of this
      # workflow, so the drift window is at most a day.
      #
      # THE WORDING IS CONSTRAINED, and that is worth saying rather than leaving to be
      # rediscovered: two architecture guards scan every file in this directory with separate
      # vocabularies and separate allowlists, and between them the bare words for shipping and
      # for the runner's own repository name are both refused HERE, in prose, whatever a comment
      # means by them. Reword; never take an exemption.
      - name: Check the factory's pull request marking against the pinned consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m scripts.check_pr_title_marking_compatibility

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ORCHESTRATOR_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/orchestrator_test
      SECURITY_STANDARDS_DIR: ${{ github.workspace }}/tests/fixtures/security-standards
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/orchestrator_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.31"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Upgrade empty database
        run: uv run alembic upgrade head

      - name: Run full quality gate
        run: PATH="$PWD/.venv/bin:$PATH" make check

      - name: Build fixture-registry image
        run: >-
          docker build
          --build-context registry=tests/fixtures/security-standards
          --build-arg SECURITY_STANDARDS_REVISION=0123456789abcdef0123456789abcdef01234567
          --build-arg REGISTRY_ARTIFACT_SHA256=258e4757bf84361afe847dc72ecc83452b4229d699dbf593fad50e365e80fbce
          -t orchestrator:quality .
