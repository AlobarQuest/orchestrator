# TEMPORARY PROBE — delete after it answers. Added 2026-08-29.
#
# THE QUESTION. The auto-merge cascade runs `on: pull_request`, and for a Dependabot-triggered
# event GitHub resolves `secrets.*` from the DEPENDABOT store, which is empty in all six cascade
# repositories, while `FACTORY_PR_TOKEN` sits in the ACTIONS store. So the cascade cannot arm with
# any identity but `GITHUB_TOKEN`, whose merges fire no `push` CI.
#
# This asks whether `pull_request_target` — which runs in the BASE repository's context — sees the
# Actions store for a Dependabot-authored pull request, or whether Dependabot treatment follows
# the author rather than the event.
#
# IT DISCRIMINATES. Reading one secret and finding it present proves nothing if the probe cannot
# report absence, so it reads a second name that exists in NO store and must report EMPTY. A run
# where both read the same way is a broken probe, not an answer.
#
# IT MUST BE TRIGGERED BY DEPENDABOT, NOT BY A PERSON. Dependabot secret treatment follows the
# TRIGGERING ACTOR, not the pull request's author. A first version of this fired on `reopened`,
# which HQ triggered by hand: it reported the Actions secret RESOLVED with `actor=AlobarQuest`,
# which answers a question nobody asked. `synchronize` from a `@dependabot rebase` is
# actor=dependabot[bot], which is the case the cascade actually runs in. Read the `actor=` line
# before believing any result from this file.
#
# It reads no pull-request content, checks nothing out, and prints no secret value — only whether
# each name resolved to something non-empty.
name: Secret context probe

on:
  pull_request_target:
    types: [reopened, synchronize]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secret store this context sees
        env:
          REAL: ${{ secrets.FACTORY_PR_TOKEN }}
          CONTROL: ${{ secrets.THIS_SECRET_DOES_NOT_EXIST }}
        run: |
          echo "event=${{ github.event_name }} actor=${{ github.actor }}"
          if [ -n "$REAL" ]; then echo "FACTORY_PR_TOKEN: RESOLVED"; else echo "FACTORY_PR_TOKEN: EMPTY"; fi
          if [ -n "$CONTROL" ]; then echo "CONTROL: RESOLVED (probe is broken)"; else echo "CONTROL: EMPTY (probe discriminates)"; fi
