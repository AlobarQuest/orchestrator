[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.0",
  "fastapi>=0.141.1",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.0",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.6",
  "pyjwt[crypto]>=2.13.0",
  "pydantic-settings>=2.15.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  # The zone database `zoneinfo` reads, declared rather than inherited. The policy artifact's
  # change windows name IANA zones, so a runtime without one cannot load the artifact -- and a
  # document that does not load permits nothing, which is fail-closed and also a halt. The runtime
  # base image ships a system zone database today; this makes that true of any image.
  "tzdata>=2025.1",
  "typer>=0.27.1",
  "uvicorn[standard]>=0.52.1",
]

[project.scripts]
orchestrator = "orchestrator.cli:app"
reconciliation-runner = "reconciliation_runner.cli:app"
tracker-projection-adapter = "tracker_projection_adapter.cli:app"
landing-ledger = "landing_ledger.cli:app"
deploy-watcher = "deploy_watcher.cli:app"
# ADR-0019 increment 5a. Shipped in increment 4 with a `main()` and no entry point, so
# nothing could invoke it but `python -m`; "the producer gets a caller" starts here.
change-proposer = "change_proposer.cli:main"
# ADR-0028. The producer at the head of the work lane: a dependency bump the auto-merge
# cascade refuses becomes a revision of a standing package and a work record for a person.
bump-proposer = "bump_proposer.cli:main"
# ADR-0019 increment 5b. The caller that asks the orchestrator to land what the estate has
# routed and approved. It composes nothing: every term lives inside the orchestrator.
estate-landing = "estate_lander.cli:main"
# ADR-0026, completed by ADR-0027. The carry: an approved change-manager work proposal becomes
# a registered orchestrator package intake. It writes nothing to change-manager, and registers
# only after asking the orchestrator whether the record has already caused work.
work-carrier = "work_carrier.cli:main"
# ADR-0029. The work lane's watcher: an approved record whose work was built is retired.
# Runs in the carry's pass and BEFORE it, so a finished record leaves the approved queue
# before the carry reads that queue.
work-watcher = "work_watcher.cli:main"
# ADR-0030. The machine-activation sweep: what each enrolled working copy on the operator
# machine will execute at its next start, and whether that is what was merged. It is also
# the only control over ADR-0031, whose activation helper returns 0 whatever it finds.
activation-sweep = "activation_sweep.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "ruff==0.16.2",
  "pyright==1.1.411",
  "httpx2>=2.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# ruff 0.16 formats Python code blocks inside Markdown; 0.15 did not. The affected
# files here are ADRs and historical plan documents — the record, not code — so the
# formatter is excluded from them rather than allowed to rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/alembic", "**/migrations"]
